version: '3.8'

services:
  api:
    image: salma234/dyslexia-detector
    ports:
      - "8000:8000"
    labels:
      - "netdata.enable=true"  # Enable NetData auto-discovery

  netdata:
    image: netdata/netdata
    ports:
      - "19999:19999"
    volumes:
      - netdataconfig:/etc/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  netdataconfig:
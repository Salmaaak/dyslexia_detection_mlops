name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov opencv-python numpy joblib tensorflow scikit-learn
        
    - name: Create test models
      run: |
        mkdir -p tests/test_assets
        python tests/create_test_models.py
        
    - name: Verify test assets
      run: |
        ls -la tests/test_assets/
        python -c "import tensorflow as tf; print('Feature extractor:', tf.keras.models.load_model('tests/test_assets/mini_feature_extractor.h5').summary())"
        python -c "from joblib import load; print('Classifier:', load('tests/test_assets/mini_classifier.joblib'))"
        
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src --cov-report=xml
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
    
    - name: Run monitoring tests
      run: |
        python -c "from src.app.monitoring.metrics import REQUEST_COUNT; print('Monitoring imports working')"
        python -c "from src.app.monitoring.drift import check_drift; print('Drift detection imports working')"

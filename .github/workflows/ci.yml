name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1  # Updated package for Ubuntu 24.04
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pydantic<2.0.0"
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Create test models
      run: |
        mkdir -p tests/test_assets
        python tests/create_test_models.py
        
    - name: Verify test assets
      run: |
        ls -la tests/test_assets/
        python -c "import tensorflow as tf; print('Feature extractor:', tf.keras.models.load_model('tests/test_assets/mini_feature_extractor.h5').summary())"
        python -c "from joblib import load; print('Classifier:', load('tests/test_assets/mini_classifier.joblib'))"
        
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src --cov-report=xml
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
    
    - name: Verify monitoring imports
      run: |
        python -c "from src.app.monitoring.metrics import REQUEST_COUNT; print('Monitoring metrics import successful')"
        python -c "from src.app.monitoring.drift import check_drift; print('Drift detection import successful')"